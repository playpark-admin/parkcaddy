name: ParkCaddyAR
options:
  bundleIdPrefix: app.playpark
targets:
  ParkCaddyAR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.playpark.parkcaddy
        INFOPLIST_KEY_NSCameraUsageDescription: "파크골프 지면의 거리와 상대 굴곡을 측정하기 위해 카메라가 필요합니다."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        SWIFT_VERSION: "5.0"
    frameworks: [ARKit.framework, SceneKit.framework]
