plugins { id 'com.android.application' }

android {
    namespace 'app.playpark.parkcaddy'
    compileSdk 35

    defaultConfig {
        applicationId 'app.playpark.parkcaddy'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.2.0-ground-preview'
    }
}

dependencies {
    // Align Kotlin runtime artifacts pulled transitively by AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.ar:core:1.48.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
}
