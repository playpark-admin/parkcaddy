plugins { id 'com.android.application' }

android {
    namespace 'app.playpark.parkcaddy'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            // CI test build does not overwrite the user's installed app/data.
            applicationIdSuffix '.guidedpreview'
            versionNameSuffix '-test'
        }
    }

    defaultConfig {
        applicationId 'app.playpark.parkcaddy'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.3.1-guided-preview'
    }
}

dependencies {
    // Align Kotlin runtime artifacts pulled transitively by AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.google.ar:core:1.48.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
}
